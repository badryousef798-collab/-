name: Build chapter family ZIPs

on:
  push:
    paths:
      - ".github/workflows/build-meridians-zips.yml"
      - "body-energy/08-meridians/chapters/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and verify nine family archives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re

          source = Path("body-energy/08-meridians/chapters")
          output = Path("dist/08-meridians")
          output.mkdir(parents=True, exist_ok=True)

          html_files = sorted(p for p in source.glob("*.html") if p.is_file())
          expected = {f"{family:02d}-{chapter:02d}.html"
                      for family in range(1, 10)
                      for chapter in range(1, 10)}
          actual = {p.name for p in html_files}
          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)
          if missing or unexpected or len(html_files) != 81:
              raise SystemExit(
                  f"Chapter inventory mismatch: total={len(html_files)}, "
                  f"missing={missing}, unexpected={unexpected}"
              )

          manifest = []
          for family in range(1, 10):
              prefix = f"{family:02d}-"
              members = [p for p in html_files if p.name.startswith(prefix)]
              if len(members) != 9:
                  raise SystemExit(f"Family {family:02d}: expected 9 files, got {len(members)}")
              archive = output / f"طاقة-المسارات-العائلة-{family:02d}.zip"
              with ZipFile(archive, "w", ZIP_DEFLATED, compresslevel=9) as zf:
                  for path in members:
                      zf.write(path, arcname=path.name)
              with ZipFile(archive, "r") as zf:
                  names = zf.namelist()
                  bad = zf.testzip()
                  if len(names) != 9 or bad is not None:
                      raise SystemExit(f"Archive verification failed: {archive.name}, bad={bad}, count={len(names)}")
              manifest.append(f"{archive.name}\t{len(members)} HTML files\t{archive.stat().st_size} bytes")

          (output / "manifest.txt").write_text(
              "Verified: 9 archives x 9 HTML chapters = 81 chapters\n" +
              "\n".join(manifest) + "\n", encoding="utf-8"
          )
          print("\n".join(manifest))
          print("SUCCESS: all nine ZIP archives passed integrity and file-count checks.")
          PY

      - name: Upload verified ZIP archives
        uses: actions/upload-artifact@v4
        with:
          name: taqat-almasarat-9-family-zips
          path: dist/08-meridians/
          if-no-files-found: error
          retention-days: 14
