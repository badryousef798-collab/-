name: Build Aura 60-Chapter Archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-aura-60-chapters.yml"
      - "body-energy/07-aura/chapters/**"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build and verify the complete 60-chapter ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path("body-energy/07-aura/chapters")
          output = Path("body-energy/07-aura/archives")
          output.mkdir(parents=True, exist_ok=True)
          expected = [f"{family:02d}-{chapter:02d}.html"
                      for family in range(1, 13)
                      for chapter in range(1, 6)]
          missing = [name for name in expected if not (source / name).is_file()]
          if missing:
              raise SystemExit("Missing chapter files: " + ", ".join(missing))

          archive = output / "aura-60-chapters.zip"
          with ZipFile(archive, "w", ZIP_DEFLATED, compresslevel=9) as z:
              for name in expected:
                  z.write(source / name, arcname=name)

          with ZipFile(archive, "r") as z:
              names = sorted(z.namelist())
              bad = z.testzip()
              if len(names) != 60 or names != sorted(expected) or bad is not None:
                  raise SystemExit(f"ZIP verification failed: entries={len(names)}, bad={bad}")
              print(f"Verified {len(names)} HTML chapters; archive size={archive.stat().st_size} bytes")
          PY
      - name: Commit the verified archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add body-energy/07-aura/archives/aura-60-chapters.zip
          if git diff --cached --quiet; then
            echo "Archive already up to date."
          else
            git commit -m "Add verified 60-chapter aura archive"
            git push origin HEAD:main
          fi
